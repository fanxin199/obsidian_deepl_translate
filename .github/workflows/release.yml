name: Test and release

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const manifest = require('./manifest.json');
          const version = process.env.GITHUB_REF_NAME;
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(version, manifest.version);
          assert.ok(fs.existsSync(`.github/release-notes/${version}.md`));
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package release
        run: |
          zip "deepl-translate-selection-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css "deepl-translate-selection-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            "deepl-translate-selection-${GITHUB_REF_NAME}.zip" SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME — Windows and Android" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
